<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Assistant</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-input: #0b1120;
      --border: #334155;
      --border-focus: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--bg-secondary);
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--text-muted);
    }

    .status-badge.active {
      color: #6ee7b7;
      border-color: rgba(16, 185, 129, 0.4);
    }

    .status-badge.active .status-dot {
      background-color: var(--success);
      box-shadow: 0 0 6px var(--success);
    }

    .card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input[type="password"],
    input[type="number"] {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text-main);
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input[type="password"]:focus,
    input[type="number"]:focus {
      border-color: var(--border-focus);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }

    .toggle-title {
      font-weight: 500;
      color: var(--text-main);
    }

    .toggle-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 21px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      transition: 0.2s;
      border-radius: 999px;
    }

    .slider::before {
      position: absolute;
      content: "";
      height: 15px;
      width: 15px;
      left: 2px;
      bottom: 2px;
      background-color: var(--text-muted);
      transition: 0.2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
      border-color: var(--accent);
    }

    input:checked + .slider::before {
      transform: translateX(17px);
      background-color: #ffffff;
    }

    .delay-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .delay-grid.disabled {
      opacity: 0.45;
      pointer-events: none;
    }

    .input-wrap {
      position: relative;
    }

    .input-unit {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.05s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    #startBtn {
      background-color: var(--accent);
      color: #ffffff;
    }

    #startBtn:hover {
      background-color: var(--accent-hover);
    }

    #stopBtn {
      background-color: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }

    #stopBtn:hover {
      background-color: var(--danger);
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Edgenuity</h1>
    <div id="statusBadge" class="status-badge">
      <span class="status-dot"></span>
      <span id="statusText">Idle</span>
    </div>
  </div>

  <div class="card">
    <label class="field-label" for="apiKey">Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="AIzaSy..." autocomplete="off" />
  </div>

  <div class="card">
    <label class="toggle-row" for="autoSubmit">
      <div>
        <div class="toggle-title">Auto-Submit Quiz</div>
        <div class="toggle-sub">Wait random duration before submitting</div>
      </div>
      <span class="switch">
        <input type="checkbox" id="autoSubmit" />
        <span class="slider"></span>
      </span>
    </label>

    <div id="delaySection" class="delay-grid">
      <div>
        <label class="field-label" for="minDelay">Min Delay</label>
        <div class="input-wrap">
          <input type="number" id="minDelay" min="0" max="3600" value="60" />
          <span class="input-unit">sec</span>
        </div>
      </div>
      <div>
        <label class="field-label" for="maxDelay">Max Delay</label>
        <div class="input-wrap">
          <input type="number" id="maxDelay" min="0" max="3600" value="120" />
          <span class="input-unit">sec</span>
        </div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button id="startBtn">Start</button>
    <button id="stopBtn">Stop</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
